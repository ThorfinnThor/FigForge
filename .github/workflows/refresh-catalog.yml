name: Propose catalog refresh

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: rebrickable-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional fine-grained token (this repo only; Contents and Pull requests: read and write).
      # Pushes and pull requests made with the built-in GITHUB_TOKEN do not start the Verify
      # workflow by themselves. With this token they do, so the review PR needs no manual approval.
      REFRESH_PR_TOKEN: ${{ secrets.REFRESH_PR_TOKEN }}
    steps:
      - name: Check out protected production branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download, validate, and normalize catalog
        run: npm run data:refresh:remote

      - name: Prepare official LDraw library (adopt a newer release)
        run: npm run assets:ldraw-refresh

      - name: Rebuild official LDraw catalog assets and coverage report
        run: npm run assets:ldraw-expanded && npm run assets:analyze:ldraw-coverage && npm run assets:analyze:placement-candidates

      # Hash-bound to the runtime package and expanded catalog rebuilt above; without this
      # step `verify` fails with "Accessory review queue is stale" after any accessory change.
      - name: Rebuild accessory orientation review queue
        run: npm run assets:build:accessory-review

      - name: Rebuild local semantic-search release and review worksheet
        env:
          FIGFORGE_MODEL_CACHE: ${{ github.workspace }}/public/search/models
        run: npm run search:build:release && npm run search:build:review

      # A failed guard (for example a renamed audited part) must not hide the data diff:
      # the review pull request is still opened, as a draft, and the run ends red below.
      - name: Validate proposed data and repository
        id: verify
        continue-on-error: true
        run: npm run verify

      - name: Detect generated data changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- data docs/ldraw-catalog-coverage.md public/assets/ldraw public/assets/thumbnails/ldraw-expanded public/search)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit proposed data update to automation branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          branch="automation/rebrickable-catalog-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "${REFRESH_PR_TOKEN:-}" ]]; then
            # actions/checkout stores the GITHUB_TOKEN as an extra header that would win over the URL.
            git config --local --unset-all http.https://github.com/.extraheader || true
            git remote set-url origin "https://x-access-token:${REFRESH_PR_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git fetch origin "$branch" || true
          git switch -C "$branch"
          git add -- data docs/ldraw-catalog-coverage.md public/assets/ldraw public/assets/thumbnails/ldraw-expanded public/search
          git commit -m "chore(data): propose Rebrickable catalog refresh"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"

      - name: Open or update review pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN || github.token }}
        shell: bash
        run: |
          branch="automation/rebrickable-catalog-refresh"
          base="${{ github.event.repository.default_branch }}"
          open_pr="$(gh pr list --state open --base "$base" --head "$branch" --json number --jq '.[0].number // empty')"
          draft_flag=()
          note=""
          if [[ "${{ steps.verify.outcome }}" == "failure" ]]; then
            draft_flag=(--draft)
            note=" ACHTUNG: Die Validierung ist fehlgeschlagen (Details im Workflow-Lauf und im Issue 'Katalog-Refresh fehlgeschlagen'). Dieser PR ist ein Entwurf; kuratierte Daten (z. B. geprüfte Teilenamen) müssen auf diesem Branch angepasst werden, bis verify grün ist."
          fi
          if [[ -n "$open_pr" ]]; then
            gh pr comment "$open_pr" --body "Catalog-Daten wurden neu erzeugt und der bestehende Review-PR wurde aktualisiert.${note}"
          else
            gh pr create \
              --base "$base" \
              --head "$branch" \
              ${draft_flag[@]+"${draft_flag[@]}"} \
              --title "chore(data): Rebrickable catalog refresh" \
              --body "Automatisch erzeugter Vorschlag. Nur Rebrickable Catalog Downloads/CSV und die offizielle LDraw-Bibliothek; keine MOC-Dateien und keine API. Eine neuere LDraw-Version wird mit neuem Hash in data/ldraw-source.lock.json übernommen. Vor dem Merge sind Quellen-, Schema- und Diff-Review erforderlich.${note}"
          fi

      # ADR-042: a refresh that passed the full validation merges itself once the required checks on
      # the pull request are green. A failed validation leaves a draft, which is never merged here.
      # Auto-merge needs the repository setting and the token; without either the PR just waits.
      - name: Merge the review pull request automatically after green checks
        if: steps.changes.outputs.changed == 'true' && steps.verify.outcome == 'success' && env.REFRESH_PR_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN }}
        shell: bash
        run: |
          branch="automation/rebrickable-catalog-refresh"
          base="${{ github.event.repository.default_branch }}"
          number="$(gh pr list --state open --base "$base" --head "$branch" --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            echo "::warning::No open review pull request found; nothing to merge."
            exit 0
          fi
          if [[ "$(gh pr view "$number" --json isDraft --jq .isDraft)" == "true" ]]; then
            gh pr ready "$number"
          fi
          gh pr merge "$number" --auto --merge

      # Without REFRESH_PR_TOKEN the bot's push does not start Verify, so it is dispatched here.
      # With the token the push and the pull request start it on their own.
      - name: Trigger required pull-request verification
        if: steps.changes.outputs.changed == 'true' && env.REFRESH_PR_TOKEN == ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="automation/rebrickable-catalog-refresh"
          gh workflow run ci.yml --ref "$branch"

      - name: Report no change
        if: steps.changes.outputs.changed != 'true'
        run: echo "No catalog change was proposed."

      # The BrickLink catalog download needs a login and stays a manual step. Every refresh keeps
      # the crosswalk aligned (new parts are mapped via official LDraw headers or stay blocked);
      # once the downloaded snapshot is older than 90 days an issue asks for a new one.
      - name: Check BrickLink snapshot age
        id: bricklink_age
        if: always()
        run: npm run data:check:bricklink-age

      - name: Ask for a new BrickLink snapshot
        if: always() && steps.bricklink_age.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh label create bricklink-snapshot-stale --description "BrickLink-Katalog-Snapshot ist aelter als 90 Tage" --color D4A72C 2>/dev/null || true
          body="Der BrickLink-Katalog-Snapshot vom ${{ steps.bricklink_age.outputs.snapshot_date }} ist ${{ steps.bricklink_age.outputs.age_days }} Tage alt (Grenze: 90). Seit dem Snapshot sind ${{ steps.bricklink_age.outputs.not_in_snapshot }} Teile ohne BrickLink-Zuordnung hinzugekommen.

          So geht es: auf bricklink.com anmelden, im Catalog Download die Tabellen Parts und Part and Color Codes laden (txt), dann lokal \`npm run data:import:bricklink -- <Parts.txt> <Part-and-Color-Codes.txt> YYYY-MM-DD\` ausfuehren und das Ergebnis per Pull Request einreichen. Rohdateien nicht committen."
          open_issue="$(gh issue list --state open --label bricklink-snapshot-stale --json number --jq '.[0].number // empty')"
          if [[ -n "$open_issue" ]]; then
            gh issue comment "$open_issue" --body "Weiterhin veraltet: ${{ steps.bricklink_age.outputs.age_days }} Tage."
          else
            gh issue create --label bricklink-snapshot-stale --title "BrickLink-Katalog-Snapshot erneuern" --body "$body"
          fi

      - name: Close the snapshot reminder once the snapshot is fresh
        if: always() && steps.bricklink_age.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          open_issue="$(gh issue list --state open --label bricklink-snapshot-stale --json number --jq '.[0].number // empty')"
          if [[ -n "$open_issue" ]]; then
            gh issue close "$open_issue" --comment "Der BrickLink-Snapshot ist wieder aktuell (${{ steps.bricklink_age.outputs.snapshot_date }})."
          fi

      - name: Fail the run when validation failed
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::Validation of the proposed catalog data failed. A draft review PR was opened if data changed."
          exit 1

      - name: Close open failure issue after a successful run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          open_issue="$(gh issue list --state open --label catalog-refresh-failed --json number --jq '.[0].number // empty')"
          if [[ -n "$open_issue" ]]; then
            gh issue close "$open_issue" --comment "Der Katalog-Refresh läuft wieder erfolgreich: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Report failure in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create catalog-refresh-failed --description "Automatischer Katalog-Refresh ist fehlgeschlagen" --color B42318 2>/dev/null || true
          open_issue="$(gh issue list --state open --label catalog-refresh-failed --json number --jq '.[0].number // empty')"
          if [[ -n "$open_issue" ]]; then
            gh issue comment "$open_issue" --body "Erneut fehlgeschlagen: $run_url"
          else
            gh issue create \
              --label catalog-refresh-failed \
              --title "Katalog-Refresh fehlgeschlagen" \
              --body "Der automatische Katalog-Refresh ist fehlgeschlagen und hat deshalb keinen Review-Pull-Request erzeugt: $run_url

          Meist hat eine Schutzprüfung angeschlagen (geänderter Teilename, neue LDraw-Release, Schema). Log des fehlgeschlagenen Schritts öffnen, Ursache beheben, dann den Workflow erneut starten."
          fi
