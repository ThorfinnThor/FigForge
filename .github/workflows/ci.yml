name: Verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify contracts, tests, build, and Cloudflare configuration
        run: npm run verify

      - name: Run mandatory browser regressions
        run: npm run test:browser

      - name: Run automated accessory placement preflight
        run: npm run review:accessories:auto -- --output artifacts/accessory-auto-qa

      - name: Upload accessory placement preflight
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessory-placement-preflight
          path: artifacts/accessory-auto-qa
          if-no-files-found: error
          retention-days: 14

      - name: Build accessory review contact sheets
        if: startsWith(github.head_ref, 'fix/accessory-review-') || startsWith(github.ref_name, 'fix/accessory-review-') || startsWith(github.head_ref, 'feat/automated-accessory-placement-') || startsWith(github.ref_name, 'feat/automated-accessory-placement-')
        run: npm run review:accessories -- --batch 1 --size 60 --parts-file artifacts/accessory-auto-qa/manual-review-parts.txt --output artifacts/accessory-review

      - name: Upload accessory review contact sheets
        if: startsWith(github.head_ref, 'fix/accessory-review-') || startsWith(github.ref_name, 'fix/accessory-review-') || startsWith(github.head_ref, 'feat/automated-accessory-placement-') || startsWith(github.ref_name, 'feat/automated-accessory-placement-')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessory-review-contact-sheets
          path: artifacts/accessory-review
          if-no-files-found: error
          retention-days: 14

      - name: Build complete pending accessory review contact sheets
        if: startsWith(github.head_ref, 'feat/complete-accessory-visual-review') || startsWith(github.ref_name, 'feat/complete-accessory-visual-review')
        run: npm run review:accessories -- --batch 1 --size 240 --parts-file artifacts/accessory-auto-qa/pending-review-parts.txt --output artifacts/accessory-review-complete

      - name: Upload complete pending accessory review contact sheets
        if: startsWith(github.head_ref, 'feat/complete-accessory-visual-review') || startsWith(github.ref_name, 'feat/complete-accessory-visual-review')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: complete-accessory-review-contact-sheets
          path: artifacts/accessory-review-complete
          if-no-files-found: error
          retention-days: 14
