name: Verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify contracts, tests, build, and Cloudflare configuration
        run: npm run verify

      - name: Run mandatory browser regressions
        run: npm run test:browser

      - name: Build accessory review contact sheets
        if: startsWith(github.head_ref, 'fix/accessory-review-') || startsWith(github.ref_name, 'fix/accessory-review-')
        run: npm run review:accessories -- --batch 1 --size 12 --output artifacts/accessory-review

      - name: Upload accessory review contact sheets
        if: startsWith(github.head_ref, 'fix/accessory-review-') || startsWith(github.ref_name, 'fix/accessory-review-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: accessory-review-contact-sheets
          path: artifacts/accessory-review
          if-no-files-found: error
          retention-days: 14
