version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint does not accept TypeScript 7 as a peer yet (ERESOLVE
      # in npm ci). Drop this once its peer range includes 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # react and react-dom must always share the exact same version.
      react:
        patterns:
          - react
          - react-dom
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
